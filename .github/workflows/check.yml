name: Check docs build

# On every pull request to main, build the current pages only and fail on any
# Sphinx warning (broken link, missing image, page not in a toctree), so the
# problem shows on the pull request before it goes live. This never publishes
# and is separate from build.yml, so a failed check cannot stop a deploy.

on:
  pull_request:
    branches:
      - main

jobs:
  strict-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -W turns warnings into errors; --keep-going lists all of them at once.
      - name: Build current pages, fail on warnings
        run: |
          python -m sphinx -W --keep-going -b html . _build/check
